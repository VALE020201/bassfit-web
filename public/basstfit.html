function buildWhatsAppAdvisorUrl(product, customQuestion) {
  const phone = "51999888777";
  const text =
    customQuestion ||
    `Hola equipo Bassfit 👋, solicito una evaluación previa con un asesor para el producto de Venta Consultiva: *${product.name}* (SKU: ${product.sku} - S/ ${product.price}). Mi objetivo actual es: `;
  return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
}

function buildWhatsAppCoachUrl(programTitle, userData) {
  const phone = "51999888777";
  const details = userData?.name
    ? `Soy *${userData.name}* (${userData.age || "edad no indicada"} años). Mi objetivo principal es: *${userData.goal || "Entrenamiento personalizado"}*.`
    : "Me gustaría agendar mi evaluación inicial.";
  const text = `Hola entrenadores de Bassfit 💪 («...fitness sin límites de edad..»), quiero información e inscripción en el programa: *${programTitle}*. ${details}`;
  return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
}

                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-16 grid lg:grid-cols-12 gap-10 items-center">
                    <div className="lg:col-span-7 space-y-6">
                      <div className="inline-flex items-center gap-2 bg-orange-50 border border-orange-200 text-[#FF4A00] px-4 py-1.5 rounded-full text-xs font-extrabold uppercase">
                        Concepto 2 · Clean Athletic • ...Fitness sin límites de edad..
                      </div>
                      <h1 className="text-4xl sm:text-5xl lg:text-6xl font-black text-[#0F172A] leading-[1.08] font-display">
                        Entrena con propósito, <span className="text-[#FF4A00]">fuerza y salud articular</span> a cualquier edad.
                      </h1>
                      <p className="text-lg text-slate-600 leading-relaxed max-w-2xl">
                        En <strong>Bassfit</strong> nuestro enfoque principal está en transformar tu vida mediante <strong className="text-[#FF4A00]">planes de entrenamiento personalizados y asesoría directa con entrenadores</strong>, complementados con el mejor <strong>equipamiento deportivo y suplementación</strong> seleccionada.
                      </p>
                      <div className="flex flex-wrap gap-4 pt-2">
                        <button onClick={() => setActiveTab("entrenamientos")} className="bg-[#FF4A00] hover:bg-[#E04000] text-white font-extrabold px-7 py-4 rounded-xl text-base shadow-orangeGlow transition">
                          Explorar Planes de Entrenamiento →
                        </button>
                        <button onClick={() => setActiveTab("tienda")} className="bg-[#0F172A] hover:bg-slate-800 text-white font-bold px-6 py-4 rounded-xl text-base transition">
                          Ver Catálogo de Productos (47)
                        </button>
                      </div>
                    </div>
                    <div className="lg:col-span-5">
                      <div className="bg-white p-4 rounded-3xl shadow-xl border border-slate-200">
                        <div className="grid grid-cols-2 gap-3">
                          <div className="space-y-3">
                            <img src="./images/products/kit-de-5-ligas-elasticas-1.jpg" className="w-full h-48 object-cover rounded-2xl" />
                            <img src="./images/products/pesas-rusas-1.jpg" className="w-full h-36 object-cover rounded-2xl" />
                          </div>
                          <div className="space-y-3 pt-4">
                            <img src="./images/products/banca-inclinada-1.jpg" className="w-full h-36 object-cover rounded-2xl" />
                            <img src="./images/products/maleta-de-pesas-1.jpg" className="w-full h-48 object-cover rounded-2xl" />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                <section className="py-14 bg-white">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="mb-8">
                      <span className="text-xs font-extrabold uppercase text-[#FF4A00] bg-orange-50 px-3 py-1 rounded-full border border-orange-200">
                        Entrenamientos & Estilo de Vida Activo
                      </span>
                      <h2 className="text-3xl font-black text-[#0F172A] mt-2 font-display">Programas de Entrenamiento Personalizados</h2>
                    </div>
                    <div className="grid md:grid-cols-2 gap-6">
                      {TRAINING_PROGRAMS.map((prog) => (
                        <div key={prog.id} className="rounded-3xl p-6 border-2 border-slate-200 hover:border-[#FF4A00] bg-[#F8FAFC] flex flex-col justify-between">
                          <div>
                            <span className="bg-[#0F172A] text-white text-[11px] font-extrabold px-3 py-1 rounded-full uppercase">{prog.badge}</span>
                            <h3 className="text-xl font-black text-[#0F172A] mt-3">{prog.title}</h3>
                            <p className="text-sm font-bold text-[#FF4A00] mt-1">{prog.subtitle}</p>
                            <p className="text-xs text-slate-600 mt-2">{prog.description}</p>
                          </div>
                          <div className="mt-5 pt-4 border-t border-slate-200 flex items-center justify-between">
                            <span className="text-2xl font-black text-[#0F172A]">S/ {prog.priceMonthly} <small className="text-xs font-normal text-slate-500">/ mes</small></span>
                            <a href={buildWhatsAppCoachUrl(prog.title)} target="_blank" rel="noopener noreferrer" className="bg-[#FF4A00] text-white text-xs font-extrabold px-5 py-3 rounded-xl">
                              Hablar con Entrenador →
                            </a>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                <section className="py-14 bg-[#F8FAFC] border-t border-slate-200">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex flex-wrap items-end justify-between mb-8 gap-4">
                      <div>
                        <span className="text-xs font-extrabold uppercase text-[#0F172A] bg-white px-3 py-1 rounded-full border border-slate-200">
                          Tienda Oficial Bassfit · Equipamiento & Suplementos
                        </span>
                        <h2 className="text-3xl font-black text-[#0F172A] mt-2 font-display">Todos los Productos Disponibles ({BASSFIT_PRODUCTS.length})</h2>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        {PRODUCT_CATEGORIES.map((cat) => (
                          <button
                            key={cat.slug}
                            onClick={() => setSelectedCategory(cat.slug)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-extrabold ${selectedCategory === cat.slug ? "bg-[#0F172A] text-white" : "bg-white text-slate-700 border border-slate-200"}`}
                          >
                            {cat.label}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div className="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                      {filteredProducts.map((product) => (
                        <ProductCard
                          key={product.id}
                          product={product}
                          onOpenDetail={() => setSelectedProduct(product)}
                          onAddToCart={() => handleAddToCart(product)}
                          onTestBackendGuard={() => handleTestBackendSupplementGuard(product)}
                        />
                      ))}
                    </div>
                  </div>
                </section>
              </div>
            )}

            {activeTab === "entrenamientos" && (
              <div className="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-10">
                <div className="bg-[#0F172A] text-white rounded-3xl p-8">
                  <span className="bg-[#FF4A00] text-white text-xs font-extrabold px-3 py-1 rounded-full uppercase">Entrenamiento & Bienestar Activo</span>
                  <h1 className="text-3xl sm:text-4xl font-black mt-3 font-display">Planes de Entrenamiento & Derivación Directa a Entrenadores</h1>
                  <p className="text-slate-300 text-sm mt-2">Selecciona tu programa o llena el formulario para comunicarte con tu coach de Bassfit.</p>
                </div>
                <div className="grid md:grid-cols-2 gap-6">
                  {TRAINING_PROGRAMS.map((prog) => (
                    <div key={prog.id} className="bg-[#F8FAFC] p-6 rounded-3xl border border-slate-200 flex flex-col justify-between">
                      <div>
                        <span className="bg-[#FF4A00] text-white text-xs font-extrabold px-3 py-1 rounded-full">{prog.badge}</span>
                        <h2 className="text-2xl font-black mt-3">{prog.title}</h2>
                        <p className="text-sm text-slate-600 mt-2">{prog.description}</p>
                        <ul className="mt-4 space-y-1.5">
                          {prog.includes.map((inc, i) => (
                            <li key={i} className="text-xs text-slate-700">✓ {inc}</li>
                          ))}
                        </ul>
                      </div>
                      <div className="mt-6 pt-4 border-t border-slate-200 flex justify-between items-center">
                        <span className="text-2xl font-black">S/ {prog.priceMonthly}/mes</span>
                        <a href={buildWhatsAppCoachUrl(prog.title, coachForm)} target="_blank" rel="noopener noreferrer" className="bg-[#0F172A] hover:bg-[#FF4A00] text-white font-extrabold px-5 py-3 rounded-xl text-xs border border-[#FF4A00] transition">
                          Derivar con Coach por WhatsApp →
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === "tienda" && (
              <div className="py-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex flex-wrap gap-2 mb-6">
                  {PRODUCT_CATEGORIES.map((cat) => (
                    <button
                      key={cat.slug}
                      onClick={() => setSelectedCategory(cat.slug)}
                      className={`px-3.5 py-2 rounded-xl text-xs font-extrabold ${selectedCategory === cat.slug ? "bg-[#0F172A] text-white" : "bg-[#F8FAFC] text-slate-700 border border-slate-200"}`}
                    >
                      {cat.label}
                    </button>
                  ))}
                </div>
                <div className="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                  {filteredProducts.map((product) => (
                    <ProductCard
                      key={product.id}
                      product={product}
                      onOpenDetail={() => setSelectedProduct(product)}
                      onAddToCart={() => handleAddToCart(product)}
                      onTestBackendGuard={() => handleTestBackendSupplementGuard(product)}
                    />
                  ))}
                </div>
              </div>
            )}

            {activeTab === "comunidad" && (
              <div className="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
                <div className="bg-[#F8FAFC] p-8 rounded-3xl border border-slate-200">
                  <span className="bg-orange-100 text-[#FF4A00] text-xs font-extrabold px-3 py-1 rounded-full">
                    Formato Evergreen SEO · Sin Fechas · Sin Comentarios
                  </span>
                  <h1 className="text-3xl font-black mt-2 font-display">Comunidad & Tribu Bassfit</h1>
                </div>
                <div className="grid md:grid-cols-2 gap-6">
                  {EVERGREEN_ARTICLES.map((art) => (
                    <div key={art.id} className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm p-6 space-y-4">
                      <img src={art.heroImage} className="w-full h-52 object-cover rounded-2xl" />
                      <div className="text-xs font-extrabold text-[#FF4A00]">🎬 Video Intro ({art.shortVideoDuration}): {art.shortVideoTitle}</div>
                      <h2 className="text-xl font-black">{art.title}</h2>
                      <p className="text-sm text-slate-600">{art.seoExcerpt}</p>
                      <button onClick={() => setSelectedArticle(art)} className="bg-[#0F172A] text-white text-xs font-extrabold px-4 py-2.5 rounded-xl">
                        Ver Guía + Productos Vinculados →
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {selectedProduct && (
            <div className="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl my-8">
                <div className="flex justify-between items-center border-b pb-3 mb-5">
                  <span className="bg-[#0F172A] text-white text-xs font-bold px-3 py-1 rounded-full">{selectedProduct.categoryLabel}</span>
                  <button onClick={() => setSelectedProduct(null)} className="font-bold text-lg">✕</button>
                </div>
                <div className="grid md:grid-cols-2 gap-6">
                  <img src={selectedProduct.images[0]} className="w-full h-64 object-cover rounded-2xl border" />
                  <div className="space-y-4">
                    <h2 className="text-2xl font-black">{selectedProduct.name}</h2>
                    <div className="text-3xl font-black text-[#FF4A00]">S/ {selectedProduct.price}</div>
                    <p className="text-sm text-slate-600">{selectedProduct.shortDescription}</p>
                    <div className="bg-orange-50 p-3 rounded-xl text-xs">
                      <strong>💡 Tip del Coach Bassfit:</strong> {selectedProduct.coachTip}
                    </div>
                    {selectedProduct.saleMode === "direct_cart" ? (
                      <button
                        onClick={() => { handleAddToCart(selectedProduct); setSelectedProduct(null); }}
                        className="w-full bg-[#FF4A00] text-white font-extrabold py-3.5 rounded-xl text-sm"
                      >
                        + Añadir al Carrito Easy Pay (S/ {selectedProduct.price})
                      </button>
                    ) : (
                      <a
                        href={buildWhatsAppAdvisorUrl(selectedProduct)}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="w-full bg-[#0F172A] hover:bg-[#FF4A00] text-white font-extrabold py-3.5 rounded-xl text-sm border-2 border-[#FF4A00] block text-center transition"
                      >
                        Evaluar con Asesor por WhatsApp →
                      </a>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {selectedArticle && (
            <div className="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl my-8 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <span className="bg-orange-50 text-[#0F172A] text-xs font-bold px-3 py-1 rounded-full">
                    Artículo Evergreen SEO · Sin fechas · Sin comentarios
                  </span>
                  <button onClick={() => setSelectedArticle(null)} className="font-bold text-lg">✕</button>
                </div>
                <h2 className="text-2xl font-black">{selectedArticle.title}</h2>
                {selectedArticle.contentSections.map((s, i) => (
                  <div key={i}>
                    <h3 className="font-extrabold text-base">{s.heading}</h3>
                    <p className="text-sm text-slate-600">{s.body}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex justify-end">
              <div className="bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col justify-between overflow-y-auto">
                <div>
                  <div className="flex justify-between items-center border-b pb-4 mb-4">
                    <h3 className="text-lg font-black">Carrito Directo Easy Pay</h3>
                    <button onClick={() => setIsCartOpen(false)} className="font-bold">✕</button>
                  </div>
                  {checkoutStep === "cart" && cart.map((item) => (
                    <div key={item.product.id} className="flex items-center justify-between gap-3 py-3 border-b">
                      <img src={item.product.images[0]} className="w-14 h-14 rounded-xl object-cover" />
                      <div className="flex-1">
                        <div className="text-xs font-bold">{item.product.name}</div>
                        <div className="text-xs text-[#FF4A00] font-bold">S/ {item.product.price} x {item.quantity}</div>
                      </div>
                      <div className="font-black text-sm">S/ {item.product.price * item.quantity}</div>
                    </div>
                  ))}
                  {checkoutStep === "form" && (
                    <form onSubmit={handleProcessEasyPayCheckout} className="space-y-3">
                      <input required placeholder="Nombre Completo" className="w-full px-3 py-2 border rounded-xl text-sm" />
                      <input required type="email" placeholder="Correo Electrónico" className="w-full px-3 py-2 border rounded-xl text-sm" />
                      <input required placeholder="Dirección de Entrega" className="w-full px-3 py-2 border rounded-xl text-sm" />
                      <button type="submit" className="w-full bg-[#FF4A00] text-white font-extrabold py-3 rounded-xl text-sm">
                        Confirmar Pago S/ {cartTotal} en Easy Pay →
                      </button>
                    </form>
                  )}
                  {checkoutStep === "success" && orderConfirmation && (
                    <div className="bg-orange-50 border border-orange-400 p-4 rounded-2xl text-center space-y-2">
                      <div className="font-black text-[#0F172A]">¡Pedido Confirmado!</div>
                      <div className="text-xs">Orden: {orderConfirmation.orderReference}</div>
                    </div>
                  )}
                </div>
                {checkoutStep === "cart" && cart.length > 0 && (
                  <div className="pt-4 border-t space-y-3">
                    <div className="flex justify-between font-black text-base">
                      <span>Total Easy Pay</span>
                      <span>S/ {cartTotal}</span>
                    </div>
                    <button onClick={() => setCheckoutStep("form")} className="w-full bg-[#FF4A00] text-white font-extrabold py-3.5 rounded-xl text-sm">
                      Proceder al Pago Easy Pay →
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
