function buildWhatsAppAdvisorUrl(product, customQuestion) {
  const phone = "51967581481";
  const text =
    customQuestion ||
    `Hola equipo Bassfit 👋, solicito una evaluación previa con un asesor para el producto de Venta Consultiva: *${product.name}* (SKU: ${product.sku} - S/ ${product.price}). Mi objetivo actual es: `;
  return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
}

function buildWhatsAppCoachUrl(programTitle, userData) {
  const phone = "51967581481";
  const details = userData?.name
    ? `Soy *${userData.name}* (${userData.age || "edad no indicada"} años). Mi objetivo principal es: *${userData.goal || "Entrenamiento personalizado"}*.`
    : "Me gustaría agendar mi evaluación inicial.";
  const text = `Hola entrenadores de Bassfit 💪 («...fitness sin límites de edad..»), quiero información e inscripción en el programa: *${programTitle}*. ${details}`;
  return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
}

                        target="_blank"
                        rel="noopener noreferrer"
                        className="w-full bg-[#0F172A] hover:bg-[#FF4A00] text-white font-extrabold py-3.5 rounded-xl text-sm border-2 border-[#FF4A00] block text-center transition"
                      >
                        Evaluar con Asesor por WhatsApp →
                      </a>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {selectedArticle && (
            <div className="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl my-8 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <span className="bg-orange-50 text-[#0F172A] text-xs font-bold px-3 py-1 rounded-full">
                    Artículo Evergreen SEO · Sin fechas · Sin comentarios
                  </span>
                  <button onClick={() => setSelectedArticle(null)} className="font-bold text-lg">✕</button>
                </div>
                <h2 className="text-2xl font-black">{selectedArticle.title}</h2>
                {selectedArticle.contentSections.map((s, i) => (
                  <div key={i}>
                    <h3 className="font-extrabold text-base">{s.heading}</h3>
                    <p className="text-sm text-slate-600">{s.body}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex justify-end">
              <div className="bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col justify-between overflow-y-auto">
                <div>
                  <div className="flex justify-between items-center border-b pb-4 mb-4">
                    <h3 className="text-lg font-black">Carrito Directo Easy Pay</h3>
                    <button onClick={() => setIsCartOpen(false)} className="font-bold">✕</button>
                  </div>
                  {checkoutStep === "cart" && cart.map((item) => (
                    <div key={item.product.id} className="flex items-center justify-between gap-3 py-3 border-b">
                      <img src={item.product.images[0]} className="w-14 h-14 rounded-xl object-cover" />
                      <div className="flex-1">
                        <div className="text-xs font-bold">{item.product.name}</div>
                        <div className="text-xs text-[#FF4A00] font-bold">S/ {item.product.price} x {item.quantity}</div>
                      </div>
                      <div className="font-black text-sm">S/ {item.product.price * item.quantity}</div>
                    </div>
                  ))}
                  {checkoutStep === "form" && (
                    <form onSubmit={handleProcessEasyPayCheckout} className="space-y-3">
                      <input required placeholder="Nombre Completo" className="w-full px-3 py-2 border rounded-xl text-sm" />
                      <input required type="email" placeholder="Correo Electrónico" className="w-full px-3 py-2 border rounded-xl text-sm" />
                      <input required placeholder="Dirección de Entrega" className="w-full px-3 py-2 border rounded-xl text-sm" />
                      <button type="submit" className="w-full bg-[#FF4A00] text-white font-extrabold py-3 rounded-xl text-sm">
                        Confirmar Pago S/ {cartTotal} en Easy Pay →
                      </button>
                    </form>
                  )}
                  {checkoutStep === "success" && orderConfirmation && (
                    <div className="bg-orange-50 border border-orange-400 p-4 rounded-2xl text-center space-y-2">
                      <div className="font-black text-[#0F172A]">¡Pedido Confirmado!</div>
                      <div className="text-xs">Orden: {orderConfirmation.orderReference}</div>
                    </div>
                  )}
                </div>
                {checkoutStep === "cart" && cart.length > 0 && (
                  <div className="pt-4 border-t space-y-3">
                    <div className="flex justify-between font-black text-base">
                      <span>Total Easy Pay</span>
                      <span>S/ {cartTotal}</span>
                    </div>
                    <button onClick={() => setCheckoutStep("form")} className="w-full bg-[#FF4A00] text-white font-extrabold py-3.5 rounded-xl text-sm">
                      Proceder al Pago Easy Pay →
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
